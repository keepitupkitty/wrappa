[workspace]
members = ["core","wrappad"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "AGPLv3"

[workspace.dependencies]
anyhow = "1"
caps = "0.5"
libc = "0.2"
nix = { version = "0.31", features = ["fs", "ioctl", "socket", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["full"] }
